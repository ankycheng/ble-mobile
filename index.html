<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" type="text/css" href="style.css">
  <!-- Core Libraries -->
  <script src="p5.js"></script>
  <script src="p5.ble.js"></script>
  
  <!-- Utility and Handler Scripts -->
  <script src="utils.js"></script>
  <script src="ble-handler.js"></script>
  <script src="gps-handler.js"></script>
  <script src="compass.js"></script>
  <script src="ui-components.js"></script>
  <script src="wake-lock.js"></script>
  <script src="wander-mode.js"></script>
  
  <!-- Main Application Script -->
  <script src="sketch.js"></script>
  <!-- <script>
    if('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js');
    };
  </script> -->
</head>

<body>
  <pre id="log"></pre>
  <main>
    <div id="container"></div>
  <!-- Location Info Container -->
  <div id="location-info">
    <p id="current-position">Current Position: Waiting for GPS...</p>
    <p id="tower-radio">Tower Radio Type: -</p>
    <p id="tower-cell">Cell ID: -</p>
    <p id="tower-location">Tower Location: -</p>
    <p id="tower-distance">Distance: -</p>
    <p id="tower-angle">Angle: -</p>
    <p id="tower-debug">Debug Link: <a href="" target="_blank">View on OpenCellID</a></p>
  </div>  <!-- Main Buttons Container -->
    <div class="main-buttons-container">
      <button id="dev-mode-button">Dev Mode</button>
      <button id="connect-button">Connect to Arduino</button>
      <button id="reset-button">Reset Device</button>
      <button id="calibrate-button">Calibrate</button>
      <button id="find-tower-button">Closest Mode</button>
      <button id="switch-tower-button">All Towers</button>
      <button id="compass-button">Enable Compass</button>
      <button id="wander-mode-button">Wander Mode On</button>
    </div>
  </main>
  
  
</body>

</html>
