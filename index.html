<!DOCTYPE html>
<html lang="en">

<head>
  <link rel="manifest" href="manifest.json">
  <script src="p5.js"></script>
  <script src="p5.ble.js" type="text/javascript"></script>
  <link rel="stylesheet" type="text/css" href="style.css">
  <!-- <script>
    if('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js');
    };
  </script> -->
  <meta charset="utf-8" />
  <style>
    #location-info {
      background-color: rgba(255, 255, 255, 0.9);
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    
    #location-info p {
      margin: 5px 0;
      font-size: 14px;
    }
    
    #current-position {
      font-weight: bold;
      color: #333;
    }
    
    #tower-distance {
      color: #4CAF50;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <pre id="log"></pre>
  <main>
    <div id="container"></div>
  </main>
  <div id="location-info" style="position: absolute; top: 20px; left: 20px; font-family: Arial; color: black;">
    <p id="current-position">Current Position: Waiting for GPS...</p>
    <p id="tower-radio">Tower Radio Type: -</p>
    <p id="tower-cell">Cell ID: -</p>
    <p id="tower-location">Tower Location: -</p>
    <p id="tower-distance">Distance: -</p>
  </div>
  <script src="sketch.js"></script>
</body>

</html>
