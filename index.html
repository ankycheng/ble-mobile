<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" type="text/css" href="css/style.css">
  <!-- Core Libraries -->
  <script src="libs/p5.js"></script>
  <script src="libs/p5.ble.js"></script>
  
  <!-- Utility and Handler Scripts -->
  <script src="js/utils.js"></script>
  <script src="js/ble-handler.js"></script>
  <script src="js/gps-handler.js"></script>
  <script src="js/compass.js"></script>
  <script src="js/ui-components.js"></script>
  <script src="js/wake-lock.js"></script>
  <!-- <script src="js/wander-mode.js"></script> -->
  <!-- Main Application Script -->
  <script src="js/sketch.js"></script>
  <script>
    if('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js')
          .then(function(registration) {
            console.log('Service Worker registered with scope:', registration.scope);
          })
          .catch(function(error) {
            console.error('Service Worker registration failed:', error);
          });
    }
  </script>
</head>

<body>
  <main>
    <div id="container"></div>
  <!-- Location Info Container -->
  <div id="location-info">
    <p id="current-position">Current Position: Waiting for GPS...</p>
    <p id="tower-radio">Tower Radio Type: -</p>
    <p id="tower-cell">Cell ID: -</p>
    <p id="tower-location">Tower Location: -</p>
    <p id="tower-distance">Distance: -</p>
    <p id="tower-angle">Angle: -</p>
    <p id="tower-debug">Debug Link: <a href="" target="_blank">View on OpenCellID</a></p>
  </div>  <!-- Main Buttons Container -->
    <div class="main-buttons-container">
      <button id="dev-mode-button">Dev Mode</button>
      <button id="connect-button">Connect to Arduino</button>
      <button id="reset-button">Reset Device</button>
      <button id="calibrate-button">Calibrate</button>
      <button id="restart-session-button">Restart Session</button>
      
      <button id="find-tower-button">Closest Mode</button>
      <button id="switch-tower-button">All Towers</button>
      <button id="compass-button">Enable Compass</button>
      <button id="set-heading-button" class="dev-button">Update Heading</button>
      <!-- <button id="wander-mode-button">Wander Mode On</button> -->
    </div>

    <div id="cache-info">
      <p id="cache-name">Cache Version: -</p>
      <p id="last-commit-time">Last Commit: -</p>
      <p id="build-timestamp">Build Time: -</p>
    </div>
    <!-- Dev Console -->
    <div id="dev-console" class="dev-console">
      <div class="console-header">
        <h3>Dev Console</h3>
        <button id="clear-console">Clear</button>
      </div>
      <div id="console-output" class="console-output"></div>
    </div>
  </main>

</body>

</html>
